  - {type: variant, offset: 1823, length: 0, content: '', CK-KZ: 丹砂證道歌教子眞妙言令子知道元無名天地始我得天地先有名萬物母萬物復洪源聚隂以爲地積陽以爲天盜得三才理丹砂合自然乾坤眞正德晃朗生靈質杳杳復冥冥迴光含太乙金以砂爲主稟和水銀母太陽離火精射入希夷府靈英透景明光華赫然住白虎吸紅璃金華生玉芝欲凝成至藥萬化隨爻策丹象逐爻銖靈通難書圖寶結藍天碧霞光分五色一號紫金紅二名飛白雪三曰天谷青四號黑鉛液五名中黃精固形萬萬春百骸搜九竅是病都除了救郤老殘容身輕髪不皓續齒如銀玉視暗如燈燭隱跡在人間積行施陰德不是戀繁華玉清朝未得病者卽興醫貧者贈黃白學者遺丹經指陳道口訣功行一朝圓天書朝太極眞藥便是鉛眞汞隨火發水火應天符不得差時篩四季若不調寒暄不應律仲冬如炎暑仲夏濃霜雪多應更漏乖晦爽不明白坤火衰將滅陰侵萌未發水盛坎消陽火多將伐木相尅不相生陰陽不順律火金不返還斗錯移南北四七亂縱橫璇璣皆喪失煉土審思之留心仔細推知之不必言在勤而行之此書萬遍讀名曰上天梯孚佑帝群成胎混沌經一領先天露二得海底津三收萬物性四留五穀精五撇塵埃氣六保自來神七明陰陽理八歸大道神九得眞眞路十成混沌身}
