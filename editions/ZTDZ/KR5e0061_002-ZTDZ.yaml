body:
  text: 棲霞長春子丘處機撰七言絕句關中士民純質嚮善者甚衆道門尚七釋氏轉八毎至年交各大集其衆午後於聖前禮誦經懺謂之禮正至一月終方畢雪霽春光顯太平風和日暖倍鮮明高歌合會休懷悶大煮圓焦作禮正答樊生莫問天機事怎生唯修陰德念常更人情反覆皆仙道日用操持盡力行劉二道友素其人愛飲酒奕棋歡來日飲千鍾酒靜處時抨一局棋白髮流年當遠鑑紅塵閑事莫多知警涇陽强居二首隋何陸賈總歸空千古惺惺一夢中争似忘機合著口濳心捉住九天風百年萬事一場空急景渾如過隙中浮世柰何人不悟癡心剛待撮春風寄楊五信士題詩欲寄紙還無檢帙搜文得故書書後慇勤題一絶囑君行善莫踟蹰還楊五所惠紙扇謝公惠我白芭蕉山谷多風不用招城巿炎天無爽氣請君執捧自閑搖答喬生彼新喪偶欲休心入道物外歸心絶大魔閑中遣興益高歌靈臺著慾於今少健骨乘風己後多題楊五紙扇突兀高峰上倚天巉嵒絶壁遠含煙披襟自古嵩陽客傲世從來華嶽仙題王生紙扇自愛寥天夏日長誰僧酷暑火雲昌三焦毒熱多年盡一握清風萬古凉題喬生紙扇炎炎赤日火雲飛路上行人汗浴肌碧洞深山無事客優游松下正抨棋題王二紙扇蕤賓節後轉加炎毒熱薰蒸無處潜唯有長春碧巖洞清涼終日自安恬題周道全紙扇谿風颯颯如霜下澗水泠泠似雪翻盡日殊無勞役重何時更有鬱蒸煩題龎氏藤扇纖纖妙理織銀絲習習輕風散玉姿秋後雖然飈運爽待君應也不多時濼襄陳氏草堂茅堂高結半原陰喬木參差翠竹深車馬不聞名利遠安閑終日好棲心段生放柎值水漲漂没空身還歸段生放栰下西山時值波濤盡出關回首無心怨河伯高歌且喜脚輕還飛仙蓬萊方丈及瀛洲三島神仙一處游混合九天無罣礙飛騰八極信周流鍾吕盡無我無人性自由一師一弟話相投談經演法三山坐駕霧騰雲萬里游景福山居二首虎嘯烈風潜獸愕魔交長夜睡魂驚何時樸直道心顯慧日開張天眼明景福淹沉人事少龍門閑澹虎溪清時聞結果加咤語似聽鉤輈格磔聲山間一種紅雞作結果加咤聲入山樵採者戲語以雪妥也下去轉之鉤輈格礫鷓鴣鳥聲也述懷四首我道欲求神自放龍門時復虎相干山頭烈火三冬熾澗底陰風五月寒清虚妙理橫天下大樸淳風滿世間至道有名那見實通人無語自知還入道根源唯自許出塵消息有誰知南華始遇逍遥樂北海終投汗漫期野鶴孤雲閑活計清風明月道生涯千山磊落收雲氣四海光明耀日華隴州楊氏携月桂栽見訪四首汨没塵埃甚可憐追隨俗態幾經年偶因上士遊山水得遇高真伴聖賢一枝孤秀倚寒山四海群芳懷靦顏若遇清風佳氣會天香飄落滿人寰遊初禀氣得真詮續艶聯芳似火傳世上百花難逮月人間唯此可窮年樹密山高隱地蟠風多露少怯天寒他時復向蟾宫裏五嶽雲收四海觀放鷹放去欲齊支遁鶴籠歸寧傚右軍鵝雖符莊子能鳴義恐學茅君著愛魔隴州堂下清夢軒清夢軒中清士居清閑高卧飬真如真如養就清無夢無夢清歡樂有餘答隴州蕭防判書召因事别隴山過亭川屆石灰寺盤桓數日越趄未决公書忽至欣然乃還俄聞寵命發汧涯便欲安閑卧隴西黄鵲不思千里舉白雲猶戀故山棲自亭川回路次望龍門山南望龍門一豁開東遷鶴馭再頭迴深知此域因緣重未許他方道德該答曹王妃休休道者書召山潜洞壑非高尚自揣襟懷寔蔽蒙無益虚名相混雜不教閑坐養盲聾答京兆統軍夾谷龍虎書召休休道者方歸去赫赫王侯又到來自愧中心無道術空教外跡播塵埃贈雲外子孫可道西州行化歷歷西州向道多道人行止足乖訛公當策蹇尋山郡紏察無令外道魔寄扶風榮宰原心自得魚鱗大用指何妨馬骨高居室有誠還可信下堂無智亦徒勞惻隱狗病無人煎粥湯驢寒倒地四肢彊爲人不解修陰德轉殻何由免禍殃下手遲日月怱怱頂上飛光陰怱怱眼前移回頭返顧即成老下手速修猶太遲聰明修行大抵要聰明秖恐聰明同外呈外假内真兩相尅一邊敗後一邊成棄本逐末一念無生即自由千灾散盡復何憂不堪下劣衆生性日夜奔馳向外求進呈世宗皇帝九重天子人間貴十極仙靈象外尊試問一方終日守何如萬里即時奔答寧海書召雪滿群山路不通天教車馬不西東可憐寧海官民意目斷西山一望空聞詔起玉陽公戲作三竿紅日自由睡萬頃白雲相對閑只恐虚名動華闕有妨高枕卧青山春晩登眺殘花冉冉飛紅雨落日依依散白毫遥望西山官堠子倚天孤聳一拳高春寒海上春風日日顛山頭春色幾時妍清明過了朱明近未有紅芳到眼前陽九百六劫運天灾不可當高真上聖救無方直須受盡豐年孽再得昇平入道場公山余鄕公山之陽故作是詩十四首公山隱隱插蒼穹松影森森鎖碧空頂戴松花喫松子松溪和月飮松風松風習習透松煙習習松煙散九天天外輕盈籠萬象交光日月共迴旋千尋瀑布清明秀一派嵐光氣勢雄時被祥風吹作雨瀟瀟溟漠灑虚空青城華嶽與天台怎比吾山至大哉一簇峰巒千萬仞威儀真不讓蓬萊公山高隱白雲宫宫壓公山第一峰峰上白雲飛不斷悠悠來去惹青松參差山色有無中半入幽溟半入空依約天涯尋不見飄飄常被白雲籠公山自古白雲多結蓋層層入大羅出没群仙常不見雲中唯聽洞仙歌仙歌縹緲入公山漸入公山太一壇壇上諸仙安藥鼎時時燒出大還丹撞開天漢拂星辰獨坐蟾宫抱日輪夜牧靈龜朝引鶴飢餐松實冷披雲山頭點起一輪燈天下妖魔盡不生唯有堂堂圓覺士松間獨弄寶珠行公山春閑遺青龍耨月華同驅白虎種黄芽黄芽欲發雷霆震迸出青龍白虎牙公山夏陽光潑潑火雲凝海底蛟籠即上昇徧撮山頭三伏暑却教化作一團水公山秋雲興霞爍映天衢松密山高壓地圖絶頂崢嶸人不到昭昭獨放月輪孤公山冬同雲漠漠雪霏霏凛冽寒風刮地威吹起山中無限景瑶花瓊萼滿天飛東萊即墨之牢山三圍大海背俯或作負平川巨石巍峨群峰峭拔真洞天福地一方之勝境也然僻於海曲舉世鮮聞其名亦不佳予自昌陽醮罷抵於王城永真觀南望煙靄之間隱隱而見道衆相邀遷延數日而方屆遂閑吟二十首易爲鼇山因清暢道風云耳卓犖鼇山出海隅霏微靈秀滿天衢群峰削蠟幾千仞亂石穿空一萬株道祖二宫南鎮海謂上清宫太清宫也王明三圄北當途謂太平興國觀道南也是知物外仙游境不向人間作晝圖初觀山色有無時十日遷延尚未之咫尺洞天行不到空餘吟詠滿囊詩浮煙積翠遶山城疊嶂層巒簇畫屏造物建標東枕海雲舒霞卷日冥冥三圍大海一平田下鎮金鼇上接天日夜潮頭風輥雪彩霞深處有飛仙佳山福地隱仙靈萬壑千巖鎖洞庭造化不教當大路爲嫌人世苦檀腥牢山本即是鼇山大海中心不可攀上帝欲令修道果故移仙跡近人間重崗複嶺勢崔嵬照眼雲山翠作堆路轉山腰三百曲行人一步一徘徊松巖鬱崛瑞煙輕洞府深沉氣象清怪石亂峰誰變化亘初開闢自天成因持翰墨寫形容陟彼高崗二十重南出巨平千萬疊一層崖上一層峰四更山吐月猶斜直上東峰看曉霞日色麗天明照海金光射目眼生花天柱峯也巍峨獨建標上穿雲霧入青霄不知日月星辰謝但覺陰陽氣候調洞有佳名號白龍洞也不知何代隱仙蹤至今萬古人更變猶自嵌巖對老松洞有仙名喚老君洞也神清氣爽獨超群憑高俯視臨滄海守靜安閑對白雲華蓋真人宋太祖恃得道者也上碧霄道山從此鬱清標至今絶壁幽巖下尚有群仙聽海潮修真野客非才子行到鼇山亦有詩只欲洞天觀海日不勞雲雨待青詞白髪蒼顏未了仙遊山翫水且留連不嫌天上多官府只恐人間有俗緣修真却似上山勞脚脚難移步步高若不志心生退怠直趨天上摘蟠桃鼇山三面海浮空日出扶桑照海紅浩渺碧波千萬里盡成金色滿山東山川皆屬道生涯萬象森羅共一家不是聖賢潜制御乾坤那得久光華可歎巍巍造化功山河大地立虛空八荒四海知多少盡在含元一氣中大安己已膠西醮罷道衆相邀再遊鼈山復留題二十首上清宫十首醮罷歸來訪道山山深地僻海灣環棹船即向波濤看化出蓬萊沓靄間群峰峭抜下臨淵絶頂孤高上倚天滄海古今吞日月碧山朝夕起雲煙青山本是道人家況此仙山近海涯海闊山高無濁穢雲深地僻轉清嘉怪石嵌空自化成千奇萬狀不能名斷崖絶壁無人到日夜時聞仙樂聲曉日曚曨漸起雲山色慘澹不全真直須更上山頭看似駕天風出世塵巨石森森嶺上排巓峰岌岌到無階三秋水凍層冰結九夏雲寒疊嶂霾海上觀山勢轉雄清高突兀倚虛空朝昏磊落生雲氣變化皆由造物功陜右名山華獄稀江南尤物九華奇鼇山下枕東洋海秀出山東盡不知重重疊疊互相遮簇簇攢攢競鬥嘉眼界清凉心地爽神山自古好生涯五嶽曾經四嶽遊群山未必可相儔只因海角天涯背不得高名貫九州太清宫十首煙嵐初別上清宫曉色依稀路徑通纔到下方人未食坐觀山海一濛鴻雲煙慘澹雨霏微石洞留人不放歸應是洞天相顧念一生嗟我到來稀雲海茫茫不見涯潮頭只見浪翻花高峰萬疊連雲秀一簇圍屛是道家松風澗水兩清幽盡日清音夜未休野鶴時來應不倦閑人欲去更相留溪深石大更松多鬱鬱蒼蒼道氣和不是歷年樵採衆浮雲蔽日滿巖阿貫世高名共切雲遊山上士獨離群仙卿貴重三茅客仕族尊榮萬石君西山仰視刺天高山上仙家種碧桃桃熟幾番人換世洞中秦女體生毛清歌窈裊步虛齊月下高吟鳳舞低談笑不干浮世事相將直過九天西煙霞紫翠白雲高洞府群仙醉碧桃鼓透碧巖雷震駭滿山禽獸盡呼號道力神功不可言生成萬化獨超然大山海嶽知輕重没底空浮萬萬年八月十日自昌樂縣還濰州城北玉清觀作中秋詩十五首西縣東來至玉清金風一掃暮天晴開懷便賞中秋月只恐臨時晦不明萬木西風徧九州嚴光一夜向西流出塵爽氣清人骨是處歌歡不解留初離海嶠有餘清萬國歡心賀太平但願寶光無晦朔不教天質有虧盈渾金璞玉上天衢抱雪凝霜耀太虚四海百川無不鑒群生萬象悉安居一片清光萬里開無分茅屋與樓臺家家盡得閑吟賞更有清風助快哉有客徘徊望太虛開尊專欲賞蟾蜍蟾光不解留人意澹澹青霄只自如金波晝夜不曾閑淡蕩清輝出海山素魄高昇游物外恩光下照滿人間碧漢峥嶸自有期天光照耀本無私却憂下土昏魔重不見金輪出現恃團團皓月挂空虚百鍊青銅鑑不如一切水中皆影現群魔摘膽盡消除桂影朦朧下照人縱橫萬古不知因何當跨鶴雲霄上俯視青天白玉輪雲去雲來不暫停朝昏恍惚變陰晴今宵幸對嬋娟質剩作新詩暢道情年年此際殺生多造業彌天不柰何幸謝吾皇嚴禁切都教性命得安和聖主登基萬物安仁風滅殺自朝端邦君士庶皆修德好放蟾光與衆看靜夜迢迢起黑雲衆生無分樂天真空中自是雲遮眼天外何曾月避人百歲光陰瞬息間中秋幾度得閑顏不如鍊性如秋月晃朗身心自在閑磻溪集卷之二
