front:
  text: 皤溪集卷之六友六
  hash: sha256:a9fbad4daf9b2a5904c067216b755d3756f090e0514f1c4b0b6b649750d0cf79
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5e0061_SJB_006-250838c, image: sjb/25/250838c.png}
body:
  text: 棲霞長春子丘處機撰詞鳳棲梧寄東方學道者天下風光何處好八水三川自古長安道錦樹屛山方曲遶天涯海角誰能到既是抛家須早早雲水登程莫戀閑花草直至潼關西嶽廟教君廓爾清懷抱其二道友見訪于磻溪孤僻嵁巖清淨界鑿土安身抱道忘知解道友相看唯莫怪貧閑守拙無相待富貴功名堪倚賴多是多非尖嶮多成敗玉食馨香終不耐簟瓢寂淡常安泰今日恩量當日故知我前程迢遞時難度福祐不弘天不助忽忽欲去無門去走骨行屍心已悟魂夢悠悠且向皤溪住幸謝街坊豪傑户時時驀謂來相顧其三迷懷西轉金烏朝白帝東望銀蟾皓色籠青桂漸扣南華排菊會滿斟北海醺醺醉醉卧終南山色裏山色清高夜色無雲蔽一鳥不鳴風又細月有如書天如水雙雙鷰春山春煙淡蕩青山媚行雲亂飄空界花光石潤秀出洞天奇怪户牖平高萬丈盡耳目臨風一快多生浩劫塵情曠朗渾無纖芥堪愛逍遥自在踈枷鎖抛離業根冤債風鄰月伴道合水品天籟無限崢嶸勝景盡賜與山堂教賣千聖寶珠酬價問君誰解萬年春土埪土穴秋來温温漸覺陽和勝幽棲興道家偏稱疏懶多貧病凛冽天寒葉落山川浄窗前競雪飄風勁熱焙閑吟詠其二衲衣衲襖秋來著身漸覺時相稱霜天浄暢懐游興不怕西風勁百片千條上下穿聯定寬還正外疏狂性内放明珠瑩其三杜鵑春暖煙晴杜鵑永日啼芳樹聲聲苦勸人歸去不道歸何處我欲東歸歸去無門路君提舉有何憑據空說閑言語其四驚睡秋夜沉沉漏長睡酷多思想須依仗道情和暢不縱魔軍王打疊神情物物離心上虚空帳慧燈明放坐待金鷄唱忍辱仙人虢縣元押司求物外天機唯不審人間世事無過恁縱你英雄官極品身如賃貪饕逼迫應圖甚我自飢餐並渴飮布裘不羡披綾錦飽暖之餘邪僻禁虚堂任曲肱展脚和衣寢其二春澤數載田苖長亢旱今春雨雪何滋漫嘉兆分明知過半將來看掀天大熟謌謳滿二月花開成片段千株柳發排堤岸又待教人裝好漢相呼喚提壺挈榼争跳竄一澤天恩齊慶賀群生地著無飢餓愁態眉間都蹴破還真箇盈街堆畝收田課醖酒邀賓時唱和排筵看食重堆種醉飽腥檀心不挫驕矜過却憂福裏還生禍其三春興春日春風春景媚春山春谷流春水春草春花開滿地乘春勢百禽弄舌争春意澤又如膏田又美禁煙時節堪游戲正好花開連夜醉無愁繫玉山任倒和衣睡其四聲色豪氣衝天居列鼎笙歌聒地排瑶境玉鐙飛虬衫帽整風流騁不知撲入璃璃井滑壁千尋光似鏡交加出路無門徑饒你玲瓏機巧性難逃命與他送却頭皮影其五妙用千古聖賢皆一軌亘初得得從心超除此逍遥安穩地無餘理自然消息恬然美不在勞神并苦己般般放下頭頭是選甚花街并柳市虚空體本來一物無凝滯天下周游身不動人間照了心無用閑把虚空頻趯弄行雲從八方上下輕收縱兔角錐兒鑽骨痛龜毛拂子敲山重掃蕩邪魔靈物空清風送太平國裏乘鸞鳳黄鶴洞中仙贈同道都要奔波走誰肯堅心守南北東西總一般此外無他有踏盡鐵鞋迷不出菴門透水到渠成本自然行滿功還就其二虢縣渭南濼裏此地風光勝人物俱相應水竹深藏數十家户户知天命我愛清虚景䇿杖尋幽徑每日巡村轉一遭信步閑吟詠其三自述故里在天涯海上無名士因遇終南陸地仙挈我來遊此素愛斷蓬飛野鶴孤雲志頂笠披蓑人不知便是風狂子望蓬萊贈王喬二生王喬地一曲甚清嘉古道彎環連水石垂楊榱橠帶煙霞桃李間桑蔴其中有崇道兩三家知命固窮皆淡薄樂天清儉不奢華隨分保生涯其二秦川秦川好一片錦紋華日出雨晴山色秀月明風急水聲嘉千里浄無涯余到此喜慶復難加天祐恃豐堪養道地靈人傑不生邪時復伴煙霞其三南溪竹南溪竹騰秀入青冥直節虚心功未顯深根固蔕道先明霜雪豈凋零休悵恨大器晩圓成自有孤高棲鳳質能教倜儻化龍形他日看超昇其四遊興飄蓬客天賜水雲閑自在行時無日月相隨到處有蓑蠻風雨亦開顏修鍊事地軸鎖天關出有入無三尺劍長生不死一丸丹名列上仙班青蓮池上客入關重陽羽化登仙路兄弟如何措各各勤修生覺悟通無入有靜思忘念密考丹經祖一時浩劫真容露放蕩情懷任詩句直待人間功行具雲朋霞友爽邀風月笑指蓬瀛去其二幽棲一從東别長安道西往磻溪廟漸扣南山名跡沓洪溝冷淡土龕瀟洒北府何曾到夜深陌上行人悄獨聽巖前子規叫切切松梢啼到曉聲聲相勸不如歸去争柰功夫少報師恩嘲有髭僧不僧不道不温柔九百人前不害羞覺性一恃超法界知身億劫是吾囚改頭換面人難悟走骨行屍我不憂得意忘形還樸去從教人笑不風流其二渭南濼裏一方勝景滿川稀水竹彎環四面圍簇檻名花紅冉冉當門幽檜緑依依争歌稚子春風舞鬥巧靈禽曉樹啼社内人家三十户崇真修道壓皤溪一横嘉景日常新古栢森森四季春福地清高稀俗事名壇恃復會仙賓人人盡喜生中國户户䖍心敬上真唯願諸公皆省悟同登無漏出紅塵其三贈道友神仙縹緲太虚私世俗無由得見之幸遇門庭開教化臨逢齋醮莫推辭擔家造孽常終日作福治心只暫時更到時來心不謹終身何以報恩慈其四踈慵懶看經教懶燒香兀兀騰騰似醉狂日月但知生與落是非寧辨短和長客來座上心慵問飯到唇邊口倦張不是故將形體縱養成貧病療無方金蓮出玉花得遇行化重陽師父昔日甘河曾得遇大道心開設教東游海上來天涯迴首挈得吾郷三四友魏國昇遐驚動秦川百萬家其二自述蓬頭垢面不管形骸貧與賤抱樸頤神恬惔無憂樂本真氷姿玉體到了難逃沉土底子羽潘安泉下枯髏總二般其三法門寺李生求一團殠肉千古迷人看不足萬種狂心六道奔波浮更沉天真佛性昧了如何重顯證寶範仙宗覺後憑君豁蔽蒙其四夏旱時當正熱正值天高時雨闕萬里晴暉雲欲生來風旋吹如鑪天地盡日炎炎鎔暑氣物困人疲憶得前春嫌雨時其五西虢南村南村地勝曲水橫斜穿柳徑是處池塘拍塞荷花映粉墻高堂大厦户户如屏堪入畫峻嶺崇崗日日生雲遥降祥其六青峯雲收雨霽露出青峰寒骨勢野靜天空岌岌高横碧落中南溪無景與爾炎天銷日永永日題詩不賦閑愁只賦伊其七虢州與丹陽致魔作登萊濰密四海皆聞頭插筆愛争多詞不肯饒人些子兒余今向道非似從前生計較好弱都休腦後如今没筆頭悟南柯下元醮喬生簮菊白露三秋盡清霜十月初群花零落共蕭踈唯有重陽佳景獨魁梧爛慢真堪愛馨香不可辜人人皆插滿頭敷試問喬公簪著一枝無爛慢黄金蘂輕盈白玉枝重陽留得下元時醮謝星官特地獻真師牒奏三天主聲聞九地司存亡福慶已濳資大道洪恩兼付出家兒其二贈裴滿子浩浩塵埃境翩翩幻化軀中情不解了須臾任意奔波顛倒走崎嶇逗引中丹壞銷磨内藏虚悲愁灾患共縈紆百便千方醫療不能除鍊丹砂贈西虢周道全守分莫强圖遺日閑居樂天知命忍蕭疏萬事休論成與敗兀兀前途失也本來虚得也何如百年返覆乃須臾不似中心存道念賢聖相扶清心鏡警殺生萬靈中人最貴超群化數屬三才品位愚夫甚却騁兇頑便將爲容易殺害生靈圖作戲全不念地獄重重暗記一朝若大限臨頭與他家愷氣鬼神擒鞭撻跪愁開眼强欲思量巧計當頭把業鏡高懸那冤家怎諱拔舌剜心酬快意全不似舊日馨香美味三塗任百毒陵遲再生人卒未其二贈醮衆信内一强公病噎建齋筵須省可休羅列看食重重堆種本來要薦福求恩却招殃惹禍强老先生還見麽莫不是受用於身太過如今縱百味珍羞眼相看嚥唾玉鑪三澗雪勸止同道遊海最苦三冬冰雪難當萬里風塵天涯海角不離身何處參同心印況是中丹宛轉徒勞外景因循争如作伴到青春看我行藏遠近其二勤勞物外雖分端的天心未放玲瓏區區陌上走西東也學浮生作夢夢寐更勞數載巖龕復度三冬待他消息顯真空放出凌雲螮蝀其三自詠夜宿磻溪古廟曉登竹徑荒村日中無事餒巡門淡飯求他一頓不會深窮造化隨緣且度朝昏是非人我絶談論却返生前混沌一性昭彰乍顯二儀混合初融飄飄法界任西東到處神光覆擁萬籟寒泉湊頂八方瑞靄騰空怡然獨向九霄中坐看浮生作夢其四暮景杲日西沉遠隴輕飈南超洪崖飄飄逸興爽情懷吹斷愁思俗態漸漸放開心月微微射透靈臺澄澄湛湛絶塵埃瑩徹青霄物外日落風生古洞夜深月照寒潭澄澄秋色浄煙嵐獨弄圓明寶鑑認得心田要妙咄迴世俗貪婪自欣山谷卧松巖情願披麤食淡訴衷情九日後作紛紛霜葉亂飄颺時令過重陽黄花爛慢依檻猶自吐清香秋漸老夜彌長道情昌雲菴入定法界游仙不動凄凉孤城寒角韻悠颺風送入斜陽池塘菡萏無色蘭畹有餘香秋日短暮天長月華昌空空寂照蕩蕩虚心一片清凉其二風景長安風景古今奇吾道少人知天心地肺時正生殺按樞機靈物秀玉芝肥射虹霓山頭凝望目下三川壓盡華夷解冤結贈醮衆山河已定干戈不起太平時八方和義齋醮頻修盛答報虚空天地謝洪息暗中慈惠千年一遇神仙出世幸遭逢莫生輕易供養精嚴但一歳勝如一歲遇良辰大家沉醉其二自詠當初學道憑空鍊己志衝天人間無比放曠山林次後復逍遥雲水過夷門又臨秦地飄蓬十載遊程萬里度關津崎嶇迢遞事事請來但悟了般般總棄只隨緣布裘芒履其三覓飯北方一日南方一日共東西四方交日夢寐沉沉且往來遊行銷日待他年道心開日百年短景都來幾日暗椎排今朝明日不覺椎排到聖賢佳音來日洞天開是吾歸日翫丹砂遊歷雲水飄飄物外吟醍醐默黙醉中斟神仙活計道人心容易肯争三寸氣尋常不貯一文金清貧柔弱禍難侵其二土埪避暑仙院深沉古栢青森森寒影拂苔輕蕭條終日爽人情洞冷不知門外暑心閑唯覺腹中清遶身渾似積冰凌其三退道劍樹刀山雪刃橫千磨百拷死還生哀聲流血苦難登針刺著身猶害痛鋼鋩刳性莫非疼如何淫放不修行無漏子樂道去年禾今歳麥陸地如雲充塞豐稔世太平年黎民各坦然衆心安閑容易到處逍遥無事昏告宿餒求餐坊村没阻顏其二秋霽夕陽紅秋水澹雨過碧天如鑑籬菊綻塞鴻歸長郊葉亂飛上西山斟北海酩酊神游仙界霜夜冷月華清醺醺醉未醒其三假軀一團膿三寸氣使作還同傀儡誇體段騁風流人人不肯休白玉肌紅粉臉盡是浮華粧點皮肉爛血津乾荒郊你試看恣逍遥贈道友昔種良因今生福地虚空感上真加衛開壇闡化垂恩普濟凡一月於中建成三會至日相呼臨時莫避乘齋且散心游戲家中不足眉頭長繫也則是浮生過了半世忙裏偷閑師前取意勝如那苦求庸昧連朝抵暮貪生不已也道我爲人過了一世假使狂圖兼能巧智多方便藴成家計兒孫有靠金珠没底終比精神較些憔悴桃源憶故人答丹陽虚空照耀明如鏡好弱頭頭皆應隨逐狀同形影稍錯還提正他人讒說渾虚佞遠道狂言無證切告後來休聽默默依賢聖故人别後閑吟罷寂寞雲溪瀟灑百尺孤松影下獨弄周天卦清風皓月雖無價妙手奇工難晝欲向世間誇詫誰是分真假好離鄕述懷獨坐向南溪一事無能百不知所愛冥冥煙雨後東西雲綻峨峨列翠微蒼骨太虚齊冉冉寒光映日飛何事中心看不足忘歸似有膏肓病著肌亂車獨彎跧鼓腹高歌自在閑一枕游仙清夢斷怡顔笑傲聲喧碧嶂間日午啓柴關雀躍徘徊望遠山山下有人來問道知難雀臞無言笑却還蓬萊閣仙山蓬萊闕漫漫巨海深難越深難越洪波激吹怒濤翻雪玉霄東畔曾聞說虛無一境天然别天然别鼇山不動蜃樓長結其二述懷棲霞客西游棲在南溪側南溪側千尋赤岸萬株蒼栢無心只有輕雲白舉頭不見繁華色繁華色空花雜亂世人貪得爇心香學道大道無形方寸何憑在人人智見高明能降衆欲解斷群情作鬧中閑忙中靜濁中清情態如嬰懷抱如冰自蒙籠覺破前程吾言至囑君耳深聽下十分功十分志十分成征鴈回時野菊斒斕向深溪古洞彎跧孤吟靜境獨鍊還丹被夜蕭條埪局促坐艱難一性參差數載留連到如今方露因緣瓊珠達地寶月通天便出玲瓏忘機構没孜煎下手遲自詠落魄閑人本姓丘住山東東路登州自少年割斷攀緣網從師父西遊兀兀騰騰不繫留似長江一葉孤舟任紅塵白日忙如火但雲漾無憂物外優游散誕身似青霄一片閑雲任虛空來往呈嘉瑞但不惹纖塵八表天游何所親會三光日月星辰向閑中别没生涯事且作伴爲鄰心月照雲溪喬生喪偶陰陽變化萬古同於此得失暫時間又何必欣生惡死存亡壽夭都在百年中迴頭看北邙山累累皆相似身如賃舍性假權居止何處是家鄕任六道循環驅使覺來放下不受苦孜煎非眷屬莫憂他且要隄防自離苦海贈周道全知君好事從來慕争柰染浮華難去雖然欲意宇飄蓬被繫脚繩兒縛住怱怱頂上旋烏兔切莫把光陰虛度神仙咫尺道非遥但只恐人心不悟武陵春渭南楊五生朝新歲纔交生萬物時令近元宵瑞炁濛濛降碧霄方誕謫仙苗貌態堂堂殊勝敏歸道厭凡囂石爛松枯壽更遥龜鶴等都饒水雲遊自詠且住且住且向碧巖忘機絶慮自知得分薄緣輕卒難爲顯露支離幻化藏名譽搤年光時序共皤溪一帶豪民結良因妙趣望遠行因旱贈渭南王坦公醮上諸道友九夏疲天旱萬物傷時熱筭都爲人心分外生枝節鬥衣觧馬壯社火班行引拽小兄弟虛耗村村結下士無邪正上帝分優劣咱心不同彼志胡漂撇啓䖍誠修齋念善因循歲月望觀聖空裏相提挈烏夜啼戒洗麪嗚呼俗態行樂恣胸襟蓋論人情華世度光陰陰陽返覆天地有浮沉福謝殃來悲痛怎生禁統年纔過腸冑飽初侵洗麪淘筋還是競貪淫人無遠慮必有禍胎深禍未萌時誰解預防心賀聖朝靜夜夕陽沉後隴收殘照栢鎖寒煙向南溪獨坐順風長聽一派鳴泉迢迢永夜事忘閑性琴弄無絃待雲中青鳥降祥恃證陸地神仙無夢令誡奢陜右人人聽我福地好修因果天下不如斯貧富一般行坐輕可輕可輕可驕矜太過皇統年時飢餓萬户愁生眉鎖有口却無餐滴淚謾成珠顆烖禍烖禍烖禍臨頭怎趁磻溪集卷之六
