front:
  text: 磻溪集卷之四友四
  hash: sha256:3f0ae838144b2486386db1f00a672fbdb39b29f0bb43f114d4211be3267d1c91
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5e0061_HFL_004-001a, image: hfl/0797/0797-114.png}
body:
  text: 棲霞長春子丘處機撰五言律詩博州戰姑庭楸詩並引聊城之南鄒氏之室有戰姑者本蓬萊人生含巧思以綵縷紉結鳥獸魚蟲花草之類隨物變態不待規模而應之於手其精理過於生者遠甚自中年後守寡信道甚篤建菴設食以待四方煙霞之侣且有日矣無何佻薄者構成謗讟之私用浼松筠之操始知不易明辨即會其戚屬指庭下枯楸而祝之曰今仙聖在上妾身若無毫髪過願樹復榮苟或不然是妾自負矣吾誓不與若等共天日祝後歲幾半窅無朕兆里人笑而嘲之曰繄樹若生不特爾之貞而我亦富且貴矣姑聞之春夢然彼楸樹者以大定庚子歳始植既植即死風摧雨剥殆幾五稔形質朽殘固無生理越明年建已之夏即姑始禱之月也忽爾靈芽筍發於枯樹之下狀如朱草日引脩條茂葉蔽于階砌予初在陜右屢聞是說然未詳所見逮明昌辛亥塗經此州聞閭里讚道及寓宿于姑之家庭而後悉其事爲不誣自樹之復榮于今六載矣高可倍尋枝千扶疏異於凡木其傍枝四出偃蹇遒勁森然有拔俗凌雲之氣象長春先生曰至誠感物明德動天戰姑之謂乎孰謂道之云遠人病不誠其德耳因得四十字用紀不神之應時某年月日外口生非謗虚心禱證明長楸根已爛朽枿筍重榮孟氏悲黄竹田真歎紫荆昔年聞孝義今日表忠貞答虢縣猛安鎮國酷愛無人境高飛出鳥籠吟詩閑度日觀化靜臨風杖䇿南山北酣歌西坂東紅塵多少事不到白雲中答虢縣李四秀才嚴冬極瀟灑短晷急周旋獨立紅塵外孤吟碧嶂前側身窺洞口明目注山巔遥望青峰雪皚皚白映天訪終南懷道村甯之道留宿竹圜懷道訪之道攄情遠世情安居神自爽欲睡夢還驚仙院風光雅瓊林月色清儒生真得趣奚戀紫抱榮讚長生先生法眷我昏耳仙儔誰福乎東萊高士傑西洛大名殊後獲宗乘教公最後出家先開道德模深知童子力乃感聖賢扶讚玉陽先生故國真仙子東方大達人清高何異俗爽邁不同塵表裏天俱賜行藏世絶倫時時期禍福徴驗默通神寄題磻溪太公廟一景通高下三峰鎮古今路穿雲洞滑祠隱釣溪深出竇飛泉迸參天古栢陰快哉清絶地堪暢野人心春日登覽時出碧雲堂迴旋望八荒雲收千里浄風散百花香欲海愁思遠春山興味長榰笻登眺罷深入醉中鄕初雪昨夜雨成雪今朝地變銀窗明不是曉野暗即非塵出海金波淡彌天玉樹新乍觀清入眼堪動作詩人秋雨信宿天飛雨清秋地湧波沉陰韜日月浡潏漲江河紫塞歸鴻恨青山隱士歌不防居石室高枕詠煙蘿岀都乍岀皇都外高吟野興馳開籠鸚鵡俊展翼鳳凰奇白馬翩翩驟青山隱隱移長安一片錦指日到無疑登易州西山褰裳步不毛絶頂望秋毫深谷沓冥峻亂山重疊高森森骨髓戰睆睆目晴勞自笑無心客何如桂壁猱題艾山一朵黑雲寒亭亭杳靄間天垂滄海闊地鎮白雲閑五嶽名雖隱三神道可攀時觀觸石化甘露沃塵寰望崑崙舊隱崑崙地東南一望嘉玉峰排海嶽雲錦散天花氣鬱鍾三秀神清邁九華時當春雪霽盈眼白朱砂登蓬萊閣一上蓬萊閣虚心瞪目遥雲移山自長水到海還消俯視蛟龍窟傍觀鳥鵲橋何憂遠輕舉咫尺近丹霄望海海色吞天色風聲雜水聲雲翻魚鼈駭雷動鬼神驚射激千巖險汪洋萬里平時無釣鼇手擲犗引長鯨山堂雨霽曉日三竿麗千山一望平高吟神愈暢遠眺目增明雨後簷前潤風來座上清心非同道者不使過門行夜深對月二首耿耿中宵月無人獨自行下連滄海白高滿太虛清奮跡離三島游空照萬城城中多少客睡重不能驚耿耿中宵月無人獨自明天邊維斗暗地上百邪驚野鶴依稀辨群龍夭矯鳴尋常三五夜未有一般清初冬括馬值雨十月滂沱雨三更汹湧聲浮雲連海嶠激水灌山城野暗風波急泥深道路傾行人兼走馬一夜到天明初雪行看十月盡偶見六花飛散漫迴風急繽紛入夜微山川淡屏帳星斗失珠璣曉色衝天浄銀霞爛目輝游春一夜春風暖三竿曉日華有山皆著錦無地不開花金谷人多感桃源路易差迴頭皆是夢說與道人家春夜雨二首山光猶冷淡景色未鋪陳細雨偏霑物輕風不著人融和三月暖次第百花新靜夜軒中卧閑吟海上春春色來何晚清明不見花開軒觀翠竹撥土認寅芽夜雨微微作光風漸漸嘉參差三月盡桃李滿天涯雲峰九夏時炎赫千山氣鬱蒸翔空初漠漠變態復層層岌嶪真堪書孤高不可昇何當仙去也跨鶴上憑凌柎木得風修殿乏材令工師栰木海北至濱阻風殆十餘日秋人月有九日方西南風栰木乘之始達膠東日落金風順潮平栰木開雲帆争岸急曉日映天來海北雖多難膠東幸少灾不憂成大厦已見得良材自述白髮年來長紅顔日漸凋未能明道術欲去問松喬罔象如何覓還丹著甚燒欽依三洞訣得使萬緣消五言絶句藍田萬壑舒紋錦千峰列畫屛雨餘藍水白雲斷玉山青復歸隴山鶴性還山好雲峰當夏奇避風權過海得雨不留池獨坐長松下孤吟亂石邊夜騎朱頂鶴恃訪白雲仙愍物皇天生萬類萬類屬皇天何事縱陵虐不教生命全陰陽成造化生滅遞浮沉最苦有情物難當無善心秋夜露氣含秋爽天光照夜明隴頭殘月暗溪上曉風清玉露夜漫漫銀河秋耿耿風含水谷清月耀天衢冷清曉銀河初變色星斗欲翻空殘月半輪白曉霞千丈紅舞鶴夜初曉游仙夢始驚月銜山轉大風度水偏清清興三冬遊海上六出滿天涯爲訪神仙窟經過道士家酒傾金露滑茶點玉芝香神爽得三昧清和消百殃造物造物通神化流形滿大千群迷長受苦萬聖不能悛太混一恃剖空花千古繁神奇億萬變道德沓冥存萬花隨時出三光合度明九霄宫運轉八極自生成示衆色身元有限情欲浩無涯癡似蜂貪蜜狂如蝶戀花六根誰是主貪欲自招殃一念色心動百骸秋氣傷外物於身患狂心不自監病深方省欲禍極始知貪最愛三田寶難禁五欲情後生須自重元氣莫相輕四大本無託百年還有期衆人皆不悟三教莫能規失道本無命得時元有期有無皆自定貪愛復何爲紅顔若春樹白髮似秋霜俯仰一時過驅馳三界忙繁華媚春雨衰草淡秋煙日月暗相逼古今經幾遷羅綺千箱滿金珠萬斛盈只知他物好不覺自心縈厦屋千間峻淚田萬畝平自心非實相他物是虚名世事無窮變悶愁不測來志心行言之門户少兇災禍福相生滅榮枯遞獻酬不窮天外樂那免世間憂精神多削弱機巧益巉巖未及開寵鳥還同作繭蠶遇戰皆奔北逢迷孰指南身心多自役道德有誰參物裏光陰促人間興廢多覺來渾似夢貪得又如何彼此衆生性朝昏雜念魔靜觀無以救長歎復如何假饒身富貴不及性圓通道德希夷妙春秋殺伐空大夢何時覺浮生曠劫迷乾坤無晝夜日月走東西妙理無由得狂心不柰何念隨空變化精自欲消磨愛欲時光短前程地嶽深莫教空度日切要緊降心寬容無怨害柔弱勝剛强滿口齒先落終身舌未傷江海無拘容乾坤自在人子陵猶傲帝王霸不稱臣石髓能延壽丹砂解駐顔葛洪遊大海王烈遇深山觸情常决烈非道莫參差忍辱調猿馬安閑度歲時真陽加滿腹遐壽可齊天世事皆虚耗心神莫倒顛像教終難入名言不可求心中無雜念境上得閑游浮華皆是夢外物豈能堅若不通三一如何出大千可畏風前燭堪嗟水上漚百年如反掌千古暫迴頭衆生多患難大道苦希微不有神仙福難明造化機衆生皆爲口終日苦勞心目眩空花亂身隨萬物淫衆生心不盡大道理難明若要開天眼須當滅世情日月交加迫朝昏返復催光陰留不住生死突將來自然生有漏誰解入無餘不見眼前欲方知心上虚有情知道遠無事覺心寛造化開天窟精神柰歲寒茫茫三界闊混混百邪深萬古常存道群生不了心五福唯高壽三靈獨配人優游閑卒歲放浪不拘塵聖賢非道遠功德在人修不向此心覓更於何處求修道眼耳離聲色身心却有無自然通造化何必論精麤鍊氣清心士干雲抜俗標心如山不動氣似海常潮萬緣如嚼蠟三毒似銷冰既出陰陽彀那論大小乘五眼元同體三身共一枝寸心無我後圓覺照空時自生還自滅無淺亦無深不悟身非我難明物是心踏碎虚空界崩開造化權浮雲收靜境慧日照禪天一言何所在萬事不相干造化開天窟精神耐歲寒眼根雖有用心地了然休且向一生夢聊隨萬化游身猶方丈窄心若太虚寬四海千山隔三靈一體觀寂滅無心地光明耀太虚瑠璃含寶月網絡貫天珠登真無濁氣邁俗有清標急急離長夜冥冥上太霄玉鼎丹砂沸金壺碧酒香鬼神心莫測天地壽難量夢斷華胥國神游紫府天興邀三島客閑訪十洲仙道因無事得法爲有心生若解除三毒應當出五行道自無爲顯心因有法生混元含萬象太一起虚名有動緣無動無爲即有爲三光不照處萬象顯明時本自無心得何勞用意思五行不到處萬化總歸時月上中天皎風來半夜清洞天人不到閑客自相迎藥圃芝田浄金壇玉宇新壺中天不夜物外景長春十洞高真列三天上聖居白雲能送客青鳥解傳書讚道大道元無極長生豈有涯劫終權返實時運復開花道德元無象丹青晝不真聖賢潜濟物今古默通神道德三綱啓乾坤萬象陳山河嶓地軸日月走天輪恍惚神爲干氤氲氣是芽乾坤如長葉日月似開花道運陰陽秀天成造化功鬼神精不見山海氣潛通道運陰陽秀天垂雨露精三光同照耀萬化悉生成道運陰陽秀人霑雨露恩幽明隨日月造化出乾坤大朴含元氣無方禀至神至神通造化元氣合經綸大聖開天地長空布日星迴還分晝夜今古照生靈日月騰光彩風雷震沓冥含弘無作用變化有神靈磻溪集卷之四
