front:
  text: 玉峯老人講經四十年緣深未斷丙午春演羲易于條陰之北郊有三仙者自隴山來謁我祇宮囊出一篇乃磻溪丘公長春舉揚玄諦開誘迷朋而作也啟緘閱焉其文豪縱意出新奇蓋匪俗學所能知者昔王官李樂然與玉峰俱出斳秀覺之門而李自穎悟玄言驚人非世才之所能窺既與序而傳之矣嘉哉道之聰非世之聰也道之言非世之言也何以徵之乎俗學者雖能鼓頰揮毫不過歌詠情性搜邏景物至造理者明天人之際助聖賢之教亦可與日月爭懸若夫悟眞之士特不斯然發無言之言上明造化彰無形之形下脫死生信手拈來不勞神思空喑自震奮爲雷霆本文不作燦成斗星玉峰老人今於羣仙而證之不求高而自高不期神而自神豈非一氣通徹六窓洞闢動容無不妙出語總成眞本來如是非假他通者邪如磻溪集云手握靈珠常奮筆心開天籟不吹簫又云頂戴松花喫松子松溪和月飮松風又云徧撮山頭三伏暑都教化作一團氷又云有無皆自定貪愛復何爲又云酒傾金露滑茶點玉芝香又詞云般般放下頭頭是選甚花街并柳巿虛空體本來一物無凝滯又云天下周游身不動人間照了心無用又云踏盡鐵鞋迷不出菴門透略舉二三數讀者當廣知也嗚呼今之仙緣必宿有仙契者乎昔在東菴與王風仙全眞結緣在長安與馬丹陽結緣去秋濬州人來與譚仙結緣唯邱公遠處隴上是數者皆風仙之徒今悉得結其緣非人力之所能致也雖然邱仙之道豈爲吾而顯也蓋光輝之大世有不可掩者於是乎亦得與結緣焉時大定丙午歲五月日中條山玉峯老人胡光謙序蘭生深林不以無人而不香鶴鳴九皋自然有聞而及外高人勝士或幽棲窮處甘枯槁於山樊或混雜同塵肆沉淪於鄽市雖室邇而人遠覺心靜而地偏飄飄泛泛喻孤飛之雲不繫之舟隱起滅於丹霄滄溟之際將何往而不自適耶加之玄元爲師泰和爲友遐襟曠跡淵停谷虛傚內觀之達人法勤行之上士修眞養命累功及人閒亦寄興言懷高吟大著遵皇人之紫筆演大洞之空歌文辭章句往往見於世焉是以蘭之吹香鶴之聲聞乎我儀圖之今長春子丘公非斯人之徒歟而誰歟公本登州棲霞人與劉公譚公馬公俱圖學於終南王風子先生著名海上遠近敬仰號丘劉譚馬若古袪惑論所謂神仙道士若太上說養性得仙三十六法寂寞在人間者也門人弟子齎公所作詩曲雜文來謁序引余素未遂覯止臨江之表而獲覩雄編嘉其恬淡閑逸縱凡儷俚無所拘礙若游戲於翰墨畦逕外者不雕不琢匪丹匪青土鼓蕢桴之不求響奏玄酒大羹之不事味享知音知美其在斯乎唐蔣防稱靜福山廖沖曰仙書無文仙語無詞以心傳心天地不知放情逍遙今古爲誰予丘公復云時大定丁未長至日文林郎前太常博士兼校書郎雲騎尉致仕平陽毛麾序且夫至道之妙不得以聲色求而不得以形迹窺必賴至人爲馴致計摛章摘句俾得傳誦之歌詠之而漸能游聖域而造玄門者也然而句乏警策文無淵底則烏可以歆艷當時而激勵後學者哉今見長春子丘公磻溪集片言隻字皆足以警聾瞽而洗塵囂也寧非生而穎悟未弱冠而志于道不寐者餘四十載日記三千言身行萬里地三教九流貯蓄於胸臆照耀於神識故也宜乎聲馳丹闕有綸音之邀契偶眞仙喜金鱗之得因知從重陽之役者無慮千百輩唯丘劉譚馬四公時爲秀出然翹翹之譽獨有歸焉適有舊友隴西公亨道自東萊直抵奉城郡署懇求集序拜手而加款者數四自知弓刀簿領之手不足爲形容髣彿然稔慕風聲恨未披際況季侯之來引繩不可挹故讓之無計而勉書數字時泰和丙寅嵗重午後一日昭義大將軍武定軍節度使兼奉聖州管內觀察使提舉常平倉護軍漆水郡開國侯食邑一千戸食實封一百戸移刺霖題昔䝉莊著書三十三篇大率寓言藉外之論後之談道者然以黜聰去羨頤神養氣爲本至於接物誘俗革頑釋蔽亦不免託默於語東州高士長春子丘公世居登之棲霞未冠一年游崑嵛山遇重陽子王害風一言而道合遂師事之王遺以詩有被余緩緩收綸線拽入蓬萊永自由其深入理窟可知已久之與同志馬公譚公劉公陪從重陽子游南京識者目丘劉譚馬爲林下四友居無幾重陽子捐館四人護喪歸殯終南廬於墓次服除各議所之適惟公樂秦隴之風居磻溪廟六年龍門山七年匃食飲以度朝夕聲名籍甚大定戊申世宗皇帝聞之驛召至京師賜以冠巾絛服見於便殿前後凡四進長短句以述修眞之意上嘉歎焉及還山之後接物應俗隨宜答問有詩頌歌詞無慮若干首文直而理到信乎無欲觀妙深造自得者歟其徒裒爲巨帙將鋟木以廣其傳謁文以冠篇首愚以謂古隱君子有三槪或自放草澤名往從之人主之尊猶物色而招訪或持峭行不屈於俗雖有所應終不可縻以物務使人人想望風采或資槁薄而樂山林逃空虛而不返使天下常高其德不可加訾長春子兼而有之宜乎以野服承聖問使四方懷想而企慕焉非如放利之徒假隱自名欺愚誑瞽爲得計哉先生今在棲霞太虛觀未有承顔接膝之期所以序其崖略者庶他時邂逅不以我爲生客泰和戊辰閏四月望日翰林學士中順大夫知制誥兼國子司業輕車都尉穎川縣開國伯食邑七百戸賜紫金魚袋安東陳大任序
