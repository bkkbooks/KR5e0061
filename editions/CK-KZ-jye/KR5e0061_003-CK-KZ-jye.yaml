body:
  text: 青天莫起浮雲障雲起青天遮萬象萬象森羅鎮百邪光明不顯邪魔王我初開廓天地清萬戸千門歌太平有時一片黑雲起九竅百骸俱不寧是以長教慧風烈三界十方飄蕩徹雲散虛空體自眞自然現出家家月月下方堪把笛吹一聲響亮鎮華夷驚起東方玉童子倒騎白鹿如星馳逡巡别轉一般樂也非笙兮也非角三尺雲璈十二徽厯刼年中混元斲玉韻琅琅絶鄭音輕清徧貫達人心我從一得鬼神輔入地上天超古今縱橫自在無拘束心不貪榮身不辱閑唱壺中白雪歌靜調世外陽春曲吾家此曲皆自然管無孔兮琴無弦得來驚覺浮生夢晝夜清音滿洞天空山靜夜微雲作淡月疏星寒氣錯忽見長庚耀太虛迴觀北斗潛寥廓乾坤舒慘即時改宇宙紛綸何所託必有機關默動搖憑虛反覆相酬酢大哉無極玄元道何者不䝉靈應藥點化三光轉碧空滋榮萬物開花萼騰今跨古未嘗壞歷險衝艱殊不弱浩浩洪流自激揚紛紛大化誰斟酌混元一氣首興變無上至尊唯獨惡踏碎虛空出杳冥擘開混沌生揮霍陰陽升降作門戸日月縱橫爲鎖鑰暑往寒來晝夜分時通運塞興衰各旣而上立乾坤鈕復乃下鳴師範鐸建德隨方料物宜因時設教從人樂三皇五帝皆宗祖六道四生咸唯諾至聖文才尚發䝉猶龍道德何其博山深路僻行人少盡日幽巖聽啼鳥無客相陪皓月中有時獨立青雲表雲表孤吟百邪遠天涯一覽群山小調高風急韻悠颺清絶步虛神縹緲憶昔重陽泛天角清吟欲序乾坤樸釣拔扶風人不知測量大海余先覺入神妙致應難辨出俗玄談非所學返觀今日道崢嶸始得他年功卓犖首及東牟演仁孝未能化俗開籠罩五會軒軒立五名寧海金蓮登州玉華萊州平等文登七寶福山三光三州兖兖崇三教出神入夢人驚駭擲蓋投冠予計較師居東海乃猶龍馬入西秦還變豹丹陽宏道隆於陜右也大定己丑夏四月余與丹陽等數人從重陽師自文登如寧海時邁龍泉日氣稍熾師令余等前己執傘在後距半里許余忽囘顧見傘騰空而起余急返走問之云摶扶搖而上不知其然而然初傘起東北望之冉冉墜於沙間指其方而覓之了無所也時余法眷僉陽子王公隱于東海隅之查山山到文登一百一十里文登到傘起處又七十里傘起乃辰時及晡墮傘陽公菴前柄內僉陽子道號往賜之焉僉字篇韻本無乃師之所撰傘自後查山下翟公家藏之本寧海范明叔家借用者范後知往取之而弗肯予投冠者初師之登城北觀海頭上竹皮冠忽墮水漂去己而復還僉音竹十洲三島兮巨海之中瓊樓絳闕兮參差半空松陰密鎖兮無畏日紈扇不搖兮有清風流金熱佩玉眞仙未嘗說水晶宮殿開寶座星辰列碧虛懸象遶樓臺清淨化身非骨血本來身自通神談笑忽驚天上人瑤臺閬苑兮碧漢之中祥雲瑞炁兮盈盈滿空群仙出没兮灑清雨萬化開坼兮動香風炎蒸熱那裏人家不曾說煙收洞府開門倚星河列九天時復會嘉賓萬里不須乘汗血物外身自清神誰羨登樓搖扇人余觀天下形勢壯觀自潼關以東淮水以北無出登州因作望海吟用紀其實蓬萊僻東隅壯觀天下絶地鄰仙聖域山枕魚龍穴憑高望羲和目極猶未徹蒼蒼天水迴泛泛雲霞泄長風起波濤萬里卷霜雪憑凌登島嶼滉漭失丘垤有時靈氣和變化非常别森羅無限景欲辨難措舌大哉百谷王沉沉洞清徹隨時潮有信𢟍代旱無竭人間頃畝池是處廣開列比之鯨波大狀若蛙井劣望平音洋不見端瀰天自嚴潔眾流莫渾濁萬古超生滅閬苑紅塵外瑤臺碧漢間洞中仙不老雲外客長閑赤鳳吟舟穴紅厖吠藥欄青衣傳詔下白鶴送書還宴赴瓊林會詩裁羽客班浩歌金母殿長嘯玉龜山果結三千嵗樓高十二環穆王何日到方朔幾時攀姑射肌猶潔雙成貌更殷飛瓊投月窟弄玉軃華鬟命駕遊三島搏風過百蠻周旋窺海嶽奮擲上天關蕩蕩空無極滔滔興未闌恢然超法界不復戀人寰前賢後聖無差别異派同源化執迷太一混元開戸牖玄眞直指上天梯他人之言不可聽自己之心但可正若憑他口是非言壞卻自身功德性勞生有萬種最大無過色不唯喪命根復乃銷陰德還能戒此一酷勝其他百慕道修仙人從來是標格曠蕩修眞教飄颻出世門先師開戸牖歸馬動乾坤陋室迴仙觀高名軋帝閽雲朋霞友會朝禮太虛尊寶炷成雲篆華燈簇夜光星河初煥爛鍾磬乍悠颺醮主承嘉會虔心禱上蒼諸仙來顧眄接引下虛皇臣處機以大定戊申春二月自終南召赴闕下䝉賜以巾冠衫繫待詔於天長觀越十有一日旨令處機作高功法師主萬春節醮事夏四月朔徙居城北官菴越二日己巳奉聖旨塑純陽重陽丹陽三師像于官菴彩繪供具靡不精備後五月十八日召見於長松島秋七月十日再召見剖析天人之理頗愜宸衷薄暮言歸翌日迨中使賜桃一槃處機不食茶果十有餘年過荷聖恩即啗一枚中秋以他事得旨許放還山仍賜錢十萬表而辭之逮己酉嵗春途經陜州遽承哀詔時也風塵瀕洞天氣蒼黃士庶官僚盡皆素服處機雖道修方外身處世間重念皇恩寧不有感謹綴挽詞一首用表誠懇云哀詔從天降悲風到陜來黃河卷霜雪白日翳塵埃自念長松晩天恩再詔迴金槃賜桃食厚德實傷哀一日一日復一日短景渾如電光疾天長地久磨古今春去秋來變時律大夢沉沉無晝夜浮生兖兖差勞逸人情不斷猶著空我志雖高尚憂失殻昧游魂如陷穽心懷嗜欲同憐蜜蜜甜有味何日忘穽黑無明幾時出出拔須憑高尚行修治平音不假虛憢術但能物我卻親疏自然神鬼難凶吉吾身道性未開眼土塌紫扉且容膝和光同塵隨是非化聲相待無相詰白露將殘寒露潔山家冷淡觀遊絶樹頭黃葉墜千林身上麻袍聯百結舊布重煩七里市到城七里也衲衣復待三冬雪城中豪富各仁慈庶在磻溪長守拙我居西山時六年山西上有松孤然朝雲霏微接關塞暮雨淅瀝交洞天天生此境爲吾伴隔澗相陪遠相看鬱鬱蒼蒼氣色佳蕭蕭瑟瑟風聲貫連枝合抱垂重陰受命已經千載深如何今歲上春月平地忽遭樵斧侵斧聲丁丁響溪谷松煙慘慘愁山麓也知天意我將歸故遣靈巖爾先覆有夏禹廟甚靈景亡人散復何陳空山黯淡悲遊人白鶴高飛失行止蒼龍偃卧無精神亦知物象終難固凡百有形皆有數高歌物外歸去來大隱𨞬中益開悟軍夾谷公專人書召姑尋至東萊之姑性玄遠藴德含章自超拔未能撈漉今古原西出長安載脂牽殷勤邀吾於隴山余時杖策徐東還還到長安舊遊處故人不死多蒼顔迴頭爲報姑明取百嵗光陰一寒暑速抛家業違物情早作閑人伴仙侣壺中自遊日月長身外不復衰殘殃跨古騰今别無事只由大德心開張玄元大道統陰陽造化乾坤萬物昌高下如能各處分始終卽得免罹殃今之曷故多烖障蓋爲人心胡縱放美食鮮衣器用華狂明怪侣邪淫王陰陽交錯古來傳恩害相生本自然迤邐不能廉度日因循直致旱經年青霄碧落常無雨紫陌紅塵唯播土鑠石流金萬物焦鎔腸裂背群生苦有時率衆取湫科臠肉粧槃自噎飢侮慢加之傷物命喧呼何足動神袛哀哉俗態荒聲色箇箇傾危身反側安得人心似我心免遭痛切臨頭厄劉公滿室皆行善供養閑人心不倦巧行謾天我不爲至心奉道人皆羡殷勤種德養靈芽闔郡生民有幾家伫看異日功夫到共躡祥雲阿母家天蒼蒼兮臨下土胡爲不救萬靈苦萬靈日夜相凌遲飮氣吞聲死無語仰天大叫天不應一物細瑣徒勞形安得大千復混沌免教造物生精靈嗚呼天地廣開闢化出衆生千百億暴惡相侵不暫停循環受苦知何極皇天后土皆有神見死不救知何因下土悲心卻無福徒勞日夜含酸辛我聞東山雨千載無西行胡爲閱今夏屢及滂沲霐昨日午時後一洗芽甲生今日申時前再傾車軸烹千山日慘慘四野雷轟轟平地涌三尺大河侵五更蛟龍出池沼旱魃填溝坑雲漢復何有天衢從此亨顯宗好道富年壯手筆南華古形狀南華去世千載餘狀貌風格知何如只是今人重古道髣髴氣象加襟裾至人胸中本無待萬竅吹噓任天籟楊韓嵇阮心不同到了各歸於大塊草木旣凋殘冰霜何凛冽長空鳥飛盡大海魚遊絶商旅不行舟昆蟲皆閉穴誰能豐足外解把孤貧設蓬萊有客無家鄕身擬學仙遊大方大方洪水浸天闊東極萬里青茫茫曉來雨過西風急策杖憑高看呼吸鴻鴈連天剝棗晴魚龍戲水操舟入千尺絲輪直下垂碧波深處釣鯨鯢紛紛魚鼈不肯食𧥄𧥄波瀾空自迷挂席未能超彼岸乘槎再欲浮天漢天漢高高萬象明白雲誰是長生伴渾淪至道急如箭反覆陰陽自交戰太極茫茫造化開平空落落神奇見群生萬象參差出六合八紘粧點遍跨古騰今逐日新流形返樸隨時變有情無情不可窮大智小智交相攻不有聖賢開教化那知動植本虛空千經萬論垂方便寶笈琅函興眾善自昔根源發杳冥迄今道德猶光顯邇來天下教門興達士隨方化有情我亦周流三十載還鄕復到海邊城城南磊落修眞觀氣勢清高接河漢俯視滄茫渤澥深仰觀卓犖星辰煥城中信士往來多物外交朋意氣和承安四年冬十月大興黃籙演金科赤書玉字先天有白簡眞符破邪久三級瑤壇映寶光九巵神燈摛星斗巉嵒破錢酆都山列峙昇仙不可攀四夜嚴陳香火供九朝時聽步虛環千門萬戸生歡悅六街三市齊鋪設金花銀燭相輝映表裏光明自通徹忽聞空外顯嘉祥蕭索輪囷有異常玉帝傳宣行大赦仙童騎鶴下南昌幽魂滯魄皆超度白叟黃童盡欽慕天涯好事未嘗聞壓盡山東河北路清閑不在苦幽棲心上無塵到處宜北海葱葱郡城角地多花木景多奇昔年車馬空撩亂今日翻為玉清觀觀中遊戲是何人天下往來都散漢池塘寂寂鎖煙霞大寶蓮開十丈花借問經營誰施主襲封千戸太均家雲屯山上雲冥冥天風蕩搖飛雨零神奇幻怪不可測千變萬化無常形雲收雨霽杳無跡但見群山羅翠屏山高谷深復何有白石磊磊松煙青春游浩蕩滿山谷直上似欲趣天庭心虛目極淡天闊俯視漠漠環滄溟昔居菴地走三郡登萊寧海人多朝拜今爲洞天朝萬靈虛空舊基作新觀人呼舊址爲虛空也萬世不朽傳佳銘粉黛與珍玩繁華虛熱亂欲知萬事空須作百年觀憑高望南海極目天蒼蒼天際白雲起凌空飛杳茫澄澄東海月皓皓西山雪殘夜忽嚴凝清光何皎潔性逐無邊念輪迴幾萬遭五行隨變化四大不堅牢暫假因緣活空貪歲月勞不知身是患徒競物爲高在事雖能幹於身大没操六塵飛冉冉三界走嗷嗷眩惑疲雙眼貪求逼二毛刳心無膽氣戀色有脂膏白首渾如雪蒼顏不似桃未能從教化尚自騁兇豪勁捷穿雲鶻顛狂挂壁猱有時生狡猾無事起波濤罪孽如山積精神似海淘無由伴松栢直待掩蓬蒿海上風清冷天根水杳茫氷山雖斷絶暑氣自銷亡雅志橫高節虛心適大方披雲遊汗漫鼓櫂泛滄浪獨立明千古周行視八荒天星非有落地脉杳無疆幻化漚千點浮生夢一場精神隨手變花木暫時芳百歲光陰短三山道路長求仙悲漢武失道歎秦皇採藥童應老乘槎客未詳空餘三島跡時復顯嘉祥大竹山小竹山車牛島爲之三島嘉祥即海市也秋風蕩山嶽曉日驅雲煙嫩菊黃鋪地明霞翠掃天登臨思海嶠游戲挹山泉巨石危猶壯寒松老更堅巖花香馥馥澗草緑綿綿遁跡潛行道虛心不坐禪觀空雖自在遇景且留連放筆紅塵外馳名紫府邊猶慚金母訣敢道玉皇宣住世過三樂安時邁七賢韜光終返樸應物且隨緣蝶夢驚千古神遊待百年人人還得遇口口自相傳白帝離金闕蒼龍下玉京地神開要妙天質賦清英色貫銀蟾媚香浮寶殿清參差千萬樹皎潔二三更艷杏無光彩妖桃陪下情梅花先自匿柳絮敢相輕最好和風暖尤佳麗日晴游人期放曠羽客賀昇平未許塵埃染常資雨露榮郭西傳舊跡山北耀新聲爛熳鶯穿喜扶踈鵲踏驚琳宮當戸牖芝室近簷楹綽約姑山秀依稀華嶽精會看年穀熟普濟法橋成淡蕩春風暖暄和曉日遲寒裳登詰屈絶頂翫幽奇北海洪濤闊南山大澤危東風青鳥下西嶺白雲垂眼界空濛極煙光縹緲隨精神何灑落道德自扶持髣髴丹霄外參差碧漢涯那煩採芝術直赴上仙期
