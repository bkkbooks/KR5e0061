front:
  text: 重刊道藏輯要棲霞長春子丘處機撰
  hash: sha256:c5a49800cd1e7a3de38b9ba111005e238aeb192ee26b0a0f0643aa5018ef4f10
  markers:
  - {type: head, offset: 6, content: 磻溪集(又胃集¶三), id: KR5e0061_CK-KZ-jye_001-h1, level: 1}
body:
  text: 秦川自古帝王州景色蒙籠瑞氣浮觸目山河俱秀發披顔人物競風流十年苦志忘高卧萬里甘心作遠遊特縱孤雲來此地烟霞洞府習眞修故人别後信天緣浪跡西遊住虢川宛轉風塵過萬里盤桓巖谷洎三年安貧只解同今日抱樸疇能繼古仙幸得清涼無垢地棲眞且放日高眠峩峩峻嶺接雲衢古栢參差一萬株瑞草不容凡客見靈禽唯只道人呼鑿開洞府羣仙降鍊就丹砂百怪誅福地名山何處有長春即是小蓬壺臺邊水谷尤清曠野外山家至寂寥絶塞雲收天耿耿空林夜靜月蕭蕭揚眉瞬目開懷抱散髮披襟遠市朝自解偷生巖嶂窟誰能闡化法輪橋雨晴春色倍光輝風引泉聲出翠微宿鳥繁吟朝鬭巧遊人遠適夜忘歸參差緑樹初騰秀浩汗青苗乍長肥洞口時聞三島鶴天隅來訪一簑衣吾之向道極心堅佩服丹經自早年遁跡巖阿方十九飄蓬地里越三千無情不作鄕中夢有志須爲物外仙假使福輕魔障重挨排功到必周全自遊雲水獨崢嶸不戀紅塵大火坑萬頃江湖爲舊業一簑煙雨任平生醉來石上披襟卧覺後林間掉臂行每到夜深雲霽處蟾光影裏學吹笙一別家鄕整十年飄蓬雲水入秦川衣寬放蕩秋來補食飽蕭條夜處眠陜右不干浮世事天涯曾遇大羅仙功虧未得長生信坐待嘉音曠峪前本來今歲合雲遊性劣那堪道未周故我身心隨日月與他巖壑度春秋深承虢邑多才士遠訪磻溪遁跡流不在相邀居北郭此中亦可論眞修自無狂興不追遊識破諸餘萬事休誰向磻溪消鬱悶閑居巖壑且淹留昔違海上三千里魯涉途中二十州看盡名山無限景大都身外没堪酬聞說磻溪隱太公巖高樹密壯祠雄花朝石窟龍吟霧月夜山門虎嘯風萬載態羆名不朽三春馳馬獻無窮將詩爲覓千餘疋染翰聊爲度日功森森緑檜鎖天涯峭壁中藏野客家碧洞經年無火燭青山終日有煙霞虛心實腹唯求飯待客迎賓不點茶自樂安閑微得趣門風何足向人誇神明雖是落凡胎氣直終須有道材只恐丹砂臍下去重教白雪耳邊來如何脫免紅塵境似我登臨碧嶂臺步步嬉遊天漢出時時騰踏野雲開凡爲道友欲相尋不用浮財禮數欽俗物光輝難買道人情拘束易勞心疏慵寡學文章淺淡泊幽居歲月深格外閑愁都絶想雲中來聽一高吟二公何事挈槃餐出郭嬉遊草莽間宛轉尋村來訪道因循樂道暫偷閑深知舊有逍遙志遠看虛無崒嵂山盡日開懷恣談笑夜深同步月明還余今蹤跡任蹉跎寧論修行事若何道眼無光慵入市天心難合且隨波飢時只解巡門乞飽後兼能鼓腹歌除此一身愚作外萬般餘事不知他寄道友覓敗布故履余在西虢六年未嘗一新衣履每至中秋唯完補褐衲耳秋風忽起雨天凉木葉蕭疏草漸黃褐衲懸鶉唯關補芒鞋伏兔不能狂有身易着饑寒苦無福難逃日月長但願諸公懷惻隱扶持同步入仙鄕鬱鬱煙霞滿谷中冥冥心跡體虛空長歌愛履臨春水獨坐看雲對曉風遠害誠能依道力施恩未解接神功經書突奧君常究返照何須更繫東盛族文章舊得名芝蘭玉樹滿階庭光輝代代生豪傑講論時時聚德星顧我微才宏道晩知君博學貫心靈嘲吟不用多披覽續借閑書混杳冥幾年明月不昭彰玳席虛勞設萬方每恨他時遭雨隔那知今夜復雲藏仙娥莫是簪花睡玉兔還爲搗藥忙世俗歡娛無所益冥冥物外且韜光沉沉雲退晩風幽皎皎蟾光奮九州萬里碧天清照夜四郊黃葉冷飛秋高空似覩蝦蟆現大野還知魍魎囚脫灑圓明孤且潔飄飄塵外不淹留太原門下景幽深一簇仙花壓古今根榦發從雲上面祖宗來自月中心香苞灼灼披紅粉茂葉重重鎖緑陰朵朵精神皆異俗飄然特使衆人欽匠手親封月桂栽幽人自植寶花臺靈根妙絶非凡種秀氣沖和是道材日月交流千古異乾坤獨王四時開英賢好顧長春景莫把羣芳一類裁亦作猜龍門峽水淨滔滔南激朱崖雪浪高萬壑泉源爭湧湊千巖石壁競呼號周流截斷紅塵境宛轉翻開白玉膏勝境無窮言不盡臨風時顧一揮毫不怨深山自採樵山中别有好清標幽居石室仙鄕近不假環墻世事遙飲食高呼天外鶴摩雲仰看峽中鵰時時皂白浮沉景顯貫眞空慰寂寥獨自深山搤音隘寂寥閑雲作伴屛喧囂躭慵不念生涯拙好靜唯便熟境銷著假空貪齊李杜明眞何必等松喬研窮壽筭文章力豈奪虛無造化標一葉青牋仰掌開三湫白浪散花迴山有禹廟下俯三湫日中有客頻來賞月下無人獨自陪造化乾坤難比大草木之中唯蕉葉最大尋常風雨莫教摧留君日日當金案與客時時慶玉杯茅君學道於齊不見使人而金案玉杯自來人前馬氏譚君達聖朝疑情萬古一時超雲中採藥烹金鼎火後收丹貯玉瓢手握靈珠常奮筆心開天籟不吹簫看看跨鶴乘風去海上人間影迹遙一種靈禽體性高丹砂爲頂雪爲毛冥冥巨海游三島矯矯長風唳九皋灑落精神超俗物飛騰志氣接仙曹搏風整翮雲霄上萬里崢嶸自不勞東海踈狂猶目斷西京留守未心開去年奉勑三冬往今夏齋書九月來北地官榮何日罷南山道隱幾時迴直須早作彭城計燕國家風自不隤彭城乃海蟾公也高高雲外𦖠公堂閃閃雲霞照洞光千仞峯巒排左右萬株松栢互低昂山翁不解談今古野客時來講混茫休道一生空打坐也勝塵世走忙忙明昌甲寅秋九月建黃籙于福山縣二十八日午後將傳符受戒有鶴十一翶翔乎壇上終夕不去越一日設醮聞天關震響北極下紅光燭地可辨纖悉士民靡不見者華燈照耀積金山人在蓬壺咫尺間下士傾心開地府高眞威力動天關千門列祭嚴香火萬口同聲啟笑顔三界十方功德備彩雲仙鶴自迴還冬前冬後雪漫漫淑氣銷沉萬物乾出塞馬驚山路險防邊人苦鐵衣寒雖愁海北邊靈苦幸喜山東士庶安日費國資三十萬如何性命不凋殘年年三伏上平山山上遊人絶往還目視青霄雲澹澹身橫碧落性閑閑孤高迥出林巒表曠望殊非海岱間白日紅塵車馬客誰能到此一凭欄山堂高潔倚天涼天外清風入坐長青鳥有時來顧盻白雲終日自飛揚金壇玉宇知何在絳闕瓊樓古未詳爭似山家休歇去身心不動到仙鄕山堂晝靜客來稀匝坐亭亭列翠微碧漢無瑕紅日轉青山不動白雲飛參差萬有彰神化渺邈三靈合範圍終始蓋由清淨道人能天地悉皆歸三竿紅日眠猶在十里青山坐對閑不覺人來幽圃外時驚犬吠白雲間無心自得成長往了一何須問大還只恐逡巡下天詔悠揚無計樂平山聊戲之耳大風時起北溟寒萬里驚濤輥雪山怒色衝天昏氣象雷聲出地駭塵寰江神汹浪潛輸欵河伯威靈溢汗顔白馬素車空有勢非仙無路可躋攀登郡西南十里餘大開泉石致幽居山深海闊相依映地僻雲閑任卷舒夾道清池通熠燿倚天高柳挂蟾蜍鳴琴坐對煙霞客笑指勞生一夢虛爽氣清高暑氣闌園林欲變錦紋斑長風渡海來沙漠短晷經天下玉關設席邀賓龍樹側鳴琴待月虎溪間良朋自得眞佳趣不待蟾宮把桂攀臨水登山跨曉風虛心瞪丈證切目俯秋空雲迷海嶠沉沉碧日射天輪燦燦紅游興不隨他物轉和光聊與世塵同三年四度乘嘉會又到山西漲海東途中作明昌二年十月余到棲霞三年五月蓬萊道友相邀度夏自後數年爲例五月相邀耳年年五月到蓬萊麥秀金銀花也次第開野客充飢饒紫葚行人止渴待黃梅雲頭勃勃連山聳雨脚涔涔拍海來朱夏勝遊多壯觀情如天網亦恢恢六合之中萬物生人於萬物最高明能窮物外陰陽數解奪人間富貴名自昔丹砂唯九轉而今天路只三程謫仙才調無留滯坐看飛騰上太清丈夫高節氣凌雲十載潛看萬卷眞滿腹詩書雖合道出羣頭角未驚人奔牛計策元無敵立馬文章自有神異日功成心爽悟黃粱驚覺夢中身雨後方看麗景韶風前忽耳萬花凋園林一夜無顔色氣候三春太寂寥正遇東君時作巧那堪青女勢還驕生靈跋扈知難免造化根源尚未超昨日花開滿樹紅今朝花落萬枝空滋榮實藉三春秀變化虛隨一夜風物外光陰元自得人間生滅有誰窮百年大小榮枯事過眼渾如一夢中鷄鳴喔喔動精神閉息登山上湧身路惡纔分瞥竊道林深不辨往還人披雲直下觀東海絶頂孤高映北辰日用孳孳爲善者虛心牢落且同塵北極陰風渡海扇海山風物盡蕭然山陰積雪寒鋪地海上層氷凍接天鴻鵲預辭千里塞蛟龍深卧九重淵道人守拙何爲耳酷冒冰霜赴醮筵十月昌陽五穀饒追思黃籙建清標華燈羽服羅三殿絳節霓旌下九霄法事昇壇千眾集香雲結蓋萬神朝從兹降福穰穰滿一縣潛推百禍消峴石崎嶇馬不禁溪風蕭颯虎難尋山橫劍戟參差大氣鬱煙霞晻藹深道眾不游閑景色天涯都是好叢林因循北海修黃籙宛轉東萊謁翠岑乘閑杖策躡仙蹤度石穿林望蓋公西海有雲波慘澹東山初日氣濛鴻崎嶇萬壑深濳跡牢落三州暗轉蓬出處自非心染著從教著棒打虛空萬疊濃雲靄靄屯千尋白雨下山門陰陽氣激風雷急草木聲號宇宙昏鳥獸相迷煙慘慘魚龍交錯水渾渾一時造化驚天地咫尺中間孰見根昨夜南風又北風曉來天地一濛鴻零珠碎玉隨高下萬壑千巖合異同日月不知安頓處山川塞在杳冥中返觀性命陰陽理始識虛無造化功昨夜南風又北風曉來天地一濛鴻山村野店家家異柳絮梅花處處同石室松堂雲歛後瑤臺瓊榭月明中何須更問豐年瑞秖此深佳大道功法宇沉沉不下幃清齋兀兀坐忘機紛紛滿地天花落浩浩盈山海月微淡日悠揚金殿曉衝風散漫玉塵飛三冬瑞雪眞嘉慶萬古何人識是非瑞雪飄飄野興濃開門杖策久從容貪看六出瑤花墜不覺三清寶殿封暗室郊原彰玉馬斜拖闕角隱金龍高人冷冽寒巖下莫辨遙山第幾重小軒幽檻不栽花只種琅玕主嵗華直節自非凡草木虛心眞合道生涯風吹瑟瑟香還冷雨洗涓涓淨更嘉不待歲寒方見重吟窗朝夕思無邪數騎翩翩出郡城西風搖蕩菊花清吟詩馬上無橫槊訪道人間暫濯纓露下天高秋氣爽金聲玉振曉霞明山堂盡日蕭然坐似覺浮生夢且輕一陰一陽之謂道太過不及俱失中道貫三乘玄莫測中包萬有體無窮高人未悟猶占僻下士能明便發蒙儒釋道源三教祖由來千聖古今同忘機不用苦清談大隱何煩住小菴海印發光吞寶月天心燭物邁寒潭黃庭雅弄琴三疊紫府高吟酒半酣西北文章賢太守肯將珠玉寄東南人生七十古來稀不夜功成賦式微便欲休官栽菊去還令杖節與心違行藏未出陰陽數夙夜難逃變化機異日挂冠須在早莫教林下有人譏造物悠揚氣勢雄三光日夜轉鴻濛冥冥會合陰陽秀矯矯神奇幻化叢春去秋來生殺異天長地久古今同靈臺有箇眞消息未悟那堪性不通隨機接物外同塵應變無方內入神心地出離三界苦洞天游賞四時春金丹大藥經年久火棗交梨逐日新一服定超生死海不知誰是有緣人妙景從來說武官周天迴斡暮春看千株白錦霜凝雪一派香風吐麝蘭羽客徘徊昇月榭高眞依約下星壇神功暗結靈虛秀化作無邊碎玉團秦川渭水好行程不問長亭及短亭西嶽雲開仙掌白南山雨
