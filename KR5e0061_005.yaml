front:
  text: 皤溪集卷之五友五
  hash: sha256:640466fcc7530b57c2e1f33c72ba07bf0d665ae99a16b75bc5988a842e7c1573
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5e0061_HFL_005-001a, image: hfl/0797/0797-146.png}
body:
  text: 棲霞長春子丘處機撰詞無俗念居磻溪孤身蹭蹬泛秦川西入皤溪鄉域曠峪巖前幽澗畔高鑿雲龕棲跡煙火俱無簟瓢不置日用何曾積饑餐渴飲逐時村巷求覓選甚冷熱殘餘墳腸塞肚不假珍羞力好弱將來糊口過免得庖厨勞役裝貫皮囊熏蒸關竅圖使添津液色身輕健法身容易將息其二歲寒守志同雲瑞雪正三冬鬱閉嚴凝時節寂寞山家孤悄悄終日無人談說敗衲重披寒埪獨坐夜永愁難徹長更無寐朔風穿户凄冽求飯朝入西村臨泉夾道玉葉凌花結陜西有一種草長二尺許不知名秋冬則上莖死下莖活曉寒則於半莖之間結冰二稜如箭羽狀凍手頻呵仍自恨濁骨凡胎為劣晝夜參差饑寒逼迫早晚超生滅須憑一志撞開千古心月其三枰棋前程路遠未昭彰金玉仙姿靈質寂寞無功天賜我棋局開顔銷日古柏巖前清風臺上宛轉晨餐畢幽人來訪雅懷間鬥機密初似海上江邊三三五五亂鶴群鴉出打節衝關成陳勢錯雜蛟龍蟠屈妙算嘉謀斜飛正跳萬變皆歸一含弘神用不關方外經術其四讚師漫漫苦海似東溟深闊無邊無底逮逯群生顛倒競還若遊魚爭戲巨浪浮沉洪波出沒嗜欲如癡醉漂淪無限化鵬超度能幾唯有當日重陽惺惺了了獨有衝天志學易年高心大悟掣斷浮華韁繫十載丹成一時功就脫殼成蟬蛻從師别後更誰風範相繼其五蓑衣深溪古岸到秋來莎密茸茸無極揀擇修纖歸洞府虛落晴天吹炙兩束絲乾千條繩就不假良工織間軒親自結成漁父裝飾時伴樵牧嬉游青山緑水帶雨和煙適妙絶堪珍幽徑晚披雪衝開蘆荻我本忘名人皆易號喚作蓑衣客磻溪皆呼蓑衣先生他年功滿化雲天上無跡其六材虛心翠竹禀天然一氣生來清獨月下風前堪賞玩嘲謔令人無俗嫩葉蕭騷隆冬掩映秀出千林木英姿光潤狀同玄圃寒玉好事東里田侯乃東鄰菴主也南溪新種使我開青目盡日高吟窗外看風颭筠梢搖緑冉冉幽香蕭蕭疏影坐卧清肌肉雲龕間伴雅懷惟稱仙福其七月偎巖傍隴扼音隘長更蕭索昏魔非一皓月澄澄山上顯天角輝輝初出露結霜凝金華玉潤淡蕩何飄逸清臨寰宇發揚神秀姿質悽愴六合群情淹沉幽昧慘怛劬勞疾大闡良因弘濟度皆得逍遙寧謐浩氣騰騰餘光藹藹至性那虧失圓明法界法輪常自充實其八暮秋霜風蕩揚舞飄零木葉斜飛阡陌極目長郊凝望處衰菊斕斒猶坼點點蒼苔漫漫朝露漸結清霜白山川高下盡成一片秋色瀟灑萬物摧殘凄凉天氣愁損征途客水谷雲根無可玩獨有蒼蒼松柏悟道真仙忘機逸士亘古同標格欺寒壓衆自來天地饒得其九述懷群山四瀆暮天晴揮斥陰魔潜伏太一巖前風道快千尺波翻蟾足怒雪驚濤衝堤拍岸雷輥雲翻逐青鷗白鷺月明江上飛速高下萬疊千群相呼相召會合清江曲寶月神珠時逗引輥出都忘鈐束踴躍飄飄玲瓏燦燦價忽連城玉含弘光大上天入地翻覆其十仙景十洲三島運長春不夜風光無極寶閣瓊樓山上聳突兀巍峨千尺緑檜喬松丹霞密霧簇擁神仙宅漫漫雲海奈何無處尋覓遙想徐福當時樓船東下一去無消息萬里滄波空浩渺遠接天涯秋碧痛念人生難逃物化怎得游仙域超凡入聖在乎身外身易其十一樂道迎今送古歎春花秋月年年如約物換星移人事改多少翻騰淪落家給千兵官封一品得也無依託光陰如電百年隨手偷却有幸悟入玄門擘開疑網撞透真歡樂白玉壺中祥瑞覃一粒神丹輝霍月下風前天長地久自在乘鸞鶴人間虛夢不堪回首重作其十二性通法輪初轉慧風生陡覺清涼無極皓色凝空嘉氣會豁蕩塵煩胸臆五賊奔亡三尸逃遁表裏無蹤跡神思安泰湛然不動戈戟信步紫陌紅塵飢餐渴飲度日隨緣覓物外間中天地寶時復玎璫敲擊後約參師前程歸路自有真消息鶴書來召坐升雲漢游歷沁園春示衆世事紛紛似水東傾甚時了期歎利名千古爭馳虎豹丘原一旦總伴狐狸枳棘叢中桑榆影裏亂塜堆堆誰是誰君知否謾徒勞百載空皺雙眉爭如歸去來兮放四大優游無所為向碧巖古洞完全性命臨風對月笑傲希夷一曲玄歌千鍾美酒日月循環不老伊童顔在鎮龜齡鶴壽罷唱黃雞列鼎雄豪兔走烏飛轉頭悄然似電光開夜雲中乍閃晨霜迎日草上難堅立馬文章題橋名譽恍惚皆如作夢傳爭如我效忘機息慮返朴歸原壷中異景堪憐是别有風花雪月天玩四時時現祥雲瑞氣三光光覃玉洞瓊筵滿泛流霞高吟古調骨健神清丹自圓真堪愛待功成一舉永鎮飛仙智慧男兒速悟塵勞勿將性疲但此身彼物皆名幻化多虛少實不可追隨萬種纏綿千般汨沒荏苒光陰老却伊爭如向太玄真教法討論希夷乾坤蕩蕩無依似一片間雲出世奇悟性宗合道恩山易挫神舟得岸苦海難迷行滿功成仙游羽化物外何如土底歸無他事要升天入地俱在心為其二心通大智間間放蕩無拘任其自然寄雅懷幽興松間石上高歌沉醉月下風前玉女吹笙金童舞袖送我醺醺入太玄玄中理盡浮沉浩浩來自綿綿奇哉妙景難言算别是人間一洞天傲立身敦厚山磨歲月從他輕薄海變桑田神氣沖和陰陽升降已占逍遙陸地仙無煩惱任開懷縱筆狂寫詩篇其三九日虢縣修朝真醮曄曄重陽秀氣飄飄廓周大千正故菴交㑹賓朋浩浩青霄依約鴻鴈翩翩是處登高銜杯逸興放曠猶如陸地仙朝真會讚金風淡蕩玉露新鮮黃花嫩蘂堪憐散裊裊清香滿坐傳使衆人得味皆明至道群鶯無語獨王去聲秋天艷杏妖桃繁華春景莫與凝霜敢鬥堅乘嘉趣對芳叢爛飮一醉三年水龍吟西虢鳳鳴南邑清嘉大仙降跡行鸞地琳宫寶閣星壇月館槐陰竹翠煙蓋雲幢影搖寒殿往來呈瑞向虛亭東望平川似錦洪河泛渺天際山秀水甜人義遍坊村各生和氣我來不忍輕歸劉蔣天心地肺須待他時暗淘真秀育成丹桂去長安路上眠冰卧日作終身異其二警世算來浮世忙忙競爭嗜欲間煩惱六朝五霸三分七國東征西討武略今何在空悽愴野花芳草歎深謀遠慮雄心壯氣無光彩盡灰槁歷遍長安古道問郊墟百年遺老唐朝漢巿秦宫周苑明明見告故址留連故人消散莫通音耗念朝生暮死天長地久是誰能保其三夜晴夜晴寥廓初寒淡天瑩徹璃璃翠無陰樹下長安樓上月明風細百禍潛消萬家同賞一般清味見金星朗朗銀河耿耿交光燦滿天地流轉碧空如水任縱橫略無凝滯衝山拍海傾光騰秀綿綿吐瑞達了從兹寶瓶堅固玉漿恃泥把衷情欲訴何人會得且陶陶醉其四春興昊天空闊初晴氣回萬物欣欣茂亭臺俯仰山川高下粧成錦繡碧洞清泉響聞迢遞一聲長溜更時恃注目悠悠遠看青峰上白雲湊無限靈禽異獸慰間心不辭柴瘦含風翠柏雙崖爭長千株競秀耀日丹臺四時為伴百年隨壽任寒來暑往星移物換得高眠晝洞天春色盈盈亂山秀出千堆錦雲收雨斂曉晴煙淡碧空橫枕高卧怡怡頓開懷抱釋迷忘寢看仙花瑞草迎風照日騰光彩異凡品歡慶時豐歲稔萬邦寧百邪俱禁太平國裏長安陌上縱橫有甚大道無疑傍門斜徑不須詳審是從來浩劫神仙過路但普經恁其五道連混元南嶽初開瑞雲透出崑崙表星移電轉陰升陽降紅光縹眇鶴舞鸞翔看烏龜共赤蛇蟠繞盡鴻濛一氣烹成造化神仙道片時了雲散十洲三島洞天深月明風裊此時占得長生門户遐齡體調吟詠從他海移山變石枯松老伴煙霞獨向非非境外恨知音少滿庭芳述懷漂泊形骸顛狂蹤跡狀同不繫之舟逍遙終日食飽恣遨遊任使高官重祿金魚袋肥馬輕裘爭知道莊周夢蝶蝴蝶夢莊周休休吾省也貪財戀色多病多憂且麻袍葛屨間度春秋逐疃巡村過處兒童盡呼飯相留深知我南柯夢斷心上别無求其二警世百尺危樓千間峻宇艷歌出入從容幻身無賴何異燭當風舊日掀天富貴當時耀絶代英雄百年後都歸甚處一旦盡成空諸公聞早悟抽身退跡躍出樊籠念本初一點牢落無窮幸遇恃平歲稔偷間好消息圓融忘機處靈波湛湛獨鎮水晶宫其三余因求道西留關中十五餘年聞鄉中善士為葬先考妣不勝感激遂成小詞寄謝云幼稚拋家孤貧樂道縱心物外飄蓬故山墳瓏時節罷修崇幸謝鄉豪併力穿新壙起塔重重遺骸並同區改葬遷入大塋中人從關外至皆言盛德悉報微躬耳聞言心下感念無窮自恨無由報德彌加志篤進玄功深回向虔心道友各各少灾凶其四九日塞鴈聲回園林色變暮秋别是風光練波橫地錦樹映天長過雨雲山磊落迎霜茂金菊芬芳佳辰㑹千門萬户歡笑慶重陽嘉祥誰得遇吾門四友極味先嘗乃頻霑清露時倒霞漿飲罷醍醐灌頂歸來後月滿虛堂無愁思陶陶快樂酩酊入仙鄉其五神光燦悲歡絶念視聽忘懷從初號曰希夷不曉根源剛强說是談非百般拈花摘葉謾徒勞使盡心機這些事算人人易悟箇箇難依不在唇槍舌劍人前鬥惺惺廣學多知上士無爭只要返朴除疑冥冥放開四大把塵勞一旦紛飛認得後管教賢拍手笑歸推窮三教誘化群生皆令上合天為慕道修真行住坐卧歸依先須保身潔淨內常懷愍物慈悲挫剛鋭乃初心作用下手根基款款磨礱情性餘貪愛時時翦拂愚迷福慧雙全開悟自入希夷靈臺內思不疚任縱橫出處何疑徹頭了儘虛空裁斷是非修真門户大道家風長春境界無邊秀氣盈盈間裏别有壺天天中自然快樂運三光日日周旋忘伎巧任淳風坦坦聖道平平一念還鄉寂處三宫覃清靈萬派歸源浩浩神光來去透骨綿綿行人頓除造作待功成指日登仙未行者向詞中明取一言上丹霄迷惑洞天清神山秀少人行盡貪戀世夢峥嶸仙風瑞景眼前雖頓却如盲愛河終日競浮沉來往縱橫東方出西方沒南方死北方生四方轉異類翻騰區區甚日道眸開闡欲心更願將靈質悟空華彼岸高登其二贈京兆府統軍夾谷龍虎感皇恩承天詔控西南大門敞高對煙嵐雙權再任過期無代復登三晏然軍國事和平灾害封緘年將暮心歸道搜玄路訪清談降尊寵謙下無慚山人放曠本來無得有何參但能慈忍戒荒淫名挂仙銜其三答隴州防禦裴滿鎮國厭塵勞拋家計慕清間向物外觀照人間須臾變滅蜃樓欹側海濤翻暫恃光景轉身休百歲如彈掀天富傾城麗過人勇徹心姦盡逐境顛倒循環紛紛醉夢往來爭奪苦摧殘不如聞早伴煙霞高卧雲山月中仙賞月日色西沉上高臺迥觀天地寥廓疏星隱現空一輪明月昭昭無著皓然三界外似百鍊青銅鑑躍處處息光被家家照臨庭户啓溟漠長生萬里清風助乾坤蕩搖雲霧難作仙宫寶殿正爛霞金碧相輝參錯大哉銷夜景鎮千古含弘磊落有志攀青桂蟾宫兔邊看搗藥其二山居側謦懸鍾慕巢由隱淪活計蕭索天然耿介愛一身孤僻逍遙雲壑利名千種事我心上何普挂著幸遇清平世諸軍宴安刀劍罷揮霍民歌兩穗之豐教門興我忘三島之約來賓去友遞日常幽谷驂鸞騎鶴洞前無限景異花秀香風噴薄更謝汧源衆分餐助余長嘯樂其三對松落落長松倚浮雲大山高占幽僻亭亭隱士愛洞天巖穴深藏虛極對門開是景挂猿狖離羅峭壁盡日無他事唯調虎龍交媾坐磐石時時鶴聽嘉音動笙黃轉流空外飄激人明至道惡管絃幽噎花間沉溺出群常羡此歲寒重弧凝黛色鍊性超於彼身間永同居壽域瑶臺月自詠平生懶墮只嬴得無憂一枕高卧蓬頭垢面不管形骸摧挫任三光日夜奔馳放四大林泉擔荷深溪畔幽巖左青山擁白雲鎖灾禍雷轟電掣無由近我日午起行了還坐把舊習般般打破清間處唯有這些兒箇倦貪心樂受貧窮愛恣意慵興煙火糧無貯丹無貨蕭然唱灑然和堪可神仙未了優游且過其二勸酒浮名浮利歎今古悠悠顛倒人泥茫茫宇宙多少含靈愚智盡勞生終日貪圖競抵死奔波沉滯觀烏兔嗟身世百年壽一春寐虛費爭如滿酌流霞送醉助四大聊壯神氣辨萬化休論富貴時時訪山谷道人游戲效猖狂物外高吟慶滑辣杯中美味開懷抱忘愁繫解其紛挫其鋭遙致青松皓鶴綿綿度歲木蘭花慢轉輪歎靈源曠代本無極信優游自朴散形生銷磨混沌落入行囚竛竮四方宛轉向迷津大海苦淹留法界群情擾擾夢魂千古悠悠淪流販骨如山知何日是程頭好鍛鍊真空三光慧照萬劫雲收終須捨身𢬵命更惜頭護面幾時休裂碎中間一點便超得岸神舟其二西虢作善者多而感應屢至伫登臨曠望湧雲氣北山興旋恍惚陰陽虛無變化寥廓充盈奇峰狀如太華靄稜層峻極染空青急雨翻益潑墨迅雷激電飛聲威靈大騁神通三伏暑結凝冰歎是處飄風良田遇害厦屋遭傾唯斯道鄉幸感屢涔涔至也忽然輕深信皇天輔德善因惡果分明望海潮學道神仙風範長生門户從來道德為基餘外萬般留心一念顛狂造作皆非真教示開迷自上古軒轅龍駕騰飛代代相傳授至今日盡歸依虛無千聖同規蓋摧殘嗜欲剖判天機貪利喻讎觀身是夢婪耽不整容儀恬素返希夷任垢面蓬頭紙襖麻衣行滿都拋却泛寥廓步雲霓其二脫俗堅牢基址清間門户生涯不比塵緣幽曠大山通明上士逶迤倣效神仙勤動向巖前緩植桂栽松藥圃芝田萬仞高峰下伴龜鶴度流年吾常志僻心顛愛簟瓢淡薄詞翰嘲掀幽洞小溪開懷取興時成短句長篇馳馬勝花箋任奮筆狂吟走霧飛煙放蕩如如性混終日恣乾乾醉蓬萊九月十八日西虢劉氏醮乍三清鶴降萬里雲收昊天空翠玉磬琅琅動乾坤聲鋭盡日修齊虛堂設醮慶大仙恩惠滿獻霞觥長歌妙曲留連師意二九良辰菊花開遍正是重陽素秋佳氣爛慢香風健飄颻丹桂秀景稀逢上真難遇幸一時相際鴈影沉沙蟾光照夜醺醺同醉齊天樂憶法眷自東離海上元本三州四人同契異域殊鄉同行並坐終日相將游戲談玄論妙究方外清虛道家真味唱和從容一時法眷情何義如今分頭迥然苦志勤心磨鍊各逃傾逝既是飄零難為會合幽僻關山迢遞乾坤間隔望落落猶如曉星之勢再遇何年駕雲朝上帝漢宫春苦志二十年間大魔交正陳約度千重狂弓迸箭暗窗零落無窮因心睡覺透歷年無礙真宗興慧劍群魔自然消散獨騁威雄出入鋭光八表算神機莫測天網難籠驅雲掃霧蕩搖法界無蹤飛騰變化任太虛蕭瑟鳴風巡四海峥嶸往來幾箇人同留客住修道四元遇過華山共臨秦地詠歌談笑暗闡重陽嘉趣無為自令人化有幸天使官磨相間阻東連海上奮三公高義大開門户教行普歎我離群忘形慵舉內省無愆外患何憂何懼三光盛衰交變萬化恩害相生天地數留身且住待青霄得志坦然行步梅花引磻溪舊隱無名客無牽迫無桑無梓無田宅古巖前老松邊長歌隱几徐徐考太玄玄中默論無生死實際何曾分彼此貫千經協三靈包含萬化都歸一念冥行不勞坐不倦任行任坐隨吾便晚風輕暮天晴逍遙大道南溪上下平溪東幸獲忘形友月下時斟消夜酒酒杯停月華清披襟散髮欣欣唱道情六么令法性渾淪朴散天地始玄黃鳥飛兔走漸生群物類開張一點如如至性撲入臭皮囊游魂失道隨波逐浪萬年千載不還鄉錯了鴻濛體段僧愛日相望却認父母形骸做我好容光劫劫輪回販骨受盡苦和殃何人聞早尋他歸路瑩然恢廓舊嘉祥芰荷香乞食日奚為信騰騰繞村覓飯充飢瀾門餓大撑突走跳如飛張牙怒目待操心活齦人皮是則是教你看家寧分善惡不辨高低可歎狺狺此物蓋多生乖劣一性昏迷談科演教叮嚀掐耳難知雖然太上駕親臨無處慈悲為人早早修持還到恁時發憤應遲喜遷鶯鍊心要離生滅把舊習般般從頭磨徹愛欲千重身心百鍊鍊出寸心如鐵放教六神和暢不動三尸顛蹶事猛烈仗虛空一片無情分别關結除縲紲方遇至人金口傳微訣頓覺靈風吹開魔陳形似木雕泥捏既得性珠天寶勘破春花秋月恁時節鬼難呼唯有神仙提挈磻溪集卷之五
